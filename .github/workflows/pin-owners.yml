# When a pull request edits or removes a pin — tests/pins/<brand>/<model>.json,
# the frozen frames of somebody's working headphones — tell that somebody.
# Nobody but the owner can retest a model, so the owner is the review.
#
# pull_request_target so the comment can be posted on a pull request from a
# fork; nothing from the pull request is checked out or run, only the file
# list from the API and the owner named in main's copy of the pin.
name: pin owners
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths: ["tests/pins/**"]
permissions:
  contents: read
  pull-requests: write
jobs:
  mention:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const number = context.payload.pull_request.number;
            const base = context.payload.pull_request.base.sha;
            const files = await github.paginate(github.rest.pulls.listFiles,
              { owner, repo, pull_number: number, per_page: 100 });
            const touched = files.filter(f => f.filename.startsWith("tests/pins/") && f.status !== "added");
            if (!touched.length) return;
            const rows = [];
            for (const f of touched) {
              const path = f.status === "renamed" ? f.previous_filename : f.filename;
              let who = "", model = path;
              try {
                const res = await github.rest.repos.getContent({ owner, repo, path, ref: base });
                const pin = JSON.parse(Buffer.from(res.data.content, "base64").toString("utf8"));
                who = pin.owner || "";
                model = pin.model || model;
              } catch (e) {}
              rows.push(`- \`${path}\` (${f.status}) — ${model}${who ? ", @" + who : ""}`);
            }
            const marker = "<!-- omaphones-pin-owners -->";
            const body = [
              marker,
              "This pull request changes a pinned session — the frozen frames of somebody's working headphones:",
              "",
              ...rows,
              "",
              "A pin may be added, never edited: nobody here can retest another owner's model. " +
              "If you own the headphones named above and have checked this change on them, say so here " +
              "and the maintainer takes it from there. Otherwise the change to the pin has to come out.",
            ].join("\n");
            const comments = await github.paginate(github.rest.issues.listComments,
              { owner, repo, issue_number: number, per_page: 100 });
            const mine = comments.find(c => c.body && c.body.includes(marker));
            if (mine) {
              if (mine.body !== body) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: number, body });
            }
